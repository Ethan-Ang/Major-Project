<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yee Lim Adhesives | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f7f7, #e9eef5);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #1f2d3d;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      background: #ffffff;
      padding: 50px 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo-text {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 18px;
      color: #143d66;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #555;
      margin-bottom: 10px;
    }

    .highlight {
      color: #d35400;
      font-weight: bold;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #888;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .container {
        padding: 40px 25px;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-text">Yee Lim Adhesives</div>

    <h1>Stay tuned, we’re getting things glued.</h1>

    <p>
      Our website is currently under construction as we put everything together.
    </p>

    <p>
      We’ll be back soon with stronger updates, smoother browsing, and all things
      <span class="highlight">adhesive</span>.
    </p>

    <div class="footer">
      Thank you for your patience.
    </div>
  </div>
</body>
</html>
