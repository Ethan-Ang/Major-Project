  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

</head>
<body>

<a class="skip-link" href="#mainContent" data-skip-link data-i18n="common.skip">Skip to main content</a>

<div id="swup" class="transition-fade">
<!-- Return to the catalogue. NOT a breadcrumb trail: with the full desktop
     navigation visible, "Home › Products › <product>" only repeats what the
     permanent navbar (Products already lit) and the product heading below
     already say, so CSS hides this row entirely at those widths. It appears
     only once the navigation has collapsed into the mobile menu, where there is
     no visible route back to the catalogue. It is a real link with a guaranteed
     /products fallback; product-detail.js upgrades the href to the exact
     filtered/scrolled catalogue view the visitor came from when it knows it. -->
<div class="detail-backrow">
  <a class="detail-back" id="detailBackLink" href="/products"
     onclick="ylBackToCatalogue()" data-i18n-attr="aria-label:common.back_products">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    <span data-i18n="common.back_products">Back to Products</span>
  </a>
</div>

<main id="mainContent" tabindex="-1">
<!-- Gallery left, product summary right -->
<div class="detail-top" id="detailPageGrid">
  <div id="detailGallery">
    <div class="skeleton-img detail-gallery-skeleton" aria-hidden="true"></div>
  </div>
  <div class="detail-summary" id="detailSummary">
    <div class="detail-skeleton-summary" aria-hidden="true">
      <div class="skeleton-line skeleton-line-short"></div>
      <div class="skeleton-line skeleton-line-title"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line skeleton-line-mid"></div>
    </div>
  </div>
</div>

<!-- Product info: horizontal tabs on desktop, stacked accordion on phones.
     One set of panels feeds both — the .detail-tablist drives them as tabs on
     desktop; the per-section .detail-acc-head buttons drive them as an
     independent accordion at ≤640px (CSS decides which control set shows). -->
<section class="detail-tabs" aria-label="Product information">
  <div class="detail-tablist" role="tablist" aria-label="Product information tabs">
    <button class="detail-tab" id="tab-specs" role="tab" aria-selected="true" aria-controls="panel-specs" onclick="ylDetailTab('specs')" data-i18n="detail.tab_specs">Specifications</button>
    <button class="detail-tab" id="tab-apply" role="tab" aria-selected="false" aria-controls="panel-apply" tabindex="-1" onclick="ylDetailTab('apply')" data-i18n="detail.tab_apply">Application &amp; Suitable Uses</button>
    <button class="detail-tab" id="tab-downloads" role="tab" aria-selected="false" aria-controls="panel-downloads" tabindex="-1" onclick="ylDetailTab('downloads')" data-i18n="detail.tab_downloads">Downloads</button>
  </div>

  <div class="detail-section is-open" data-section="specs">
    <button class="detail-acc-head" id="acc-specs" type="button" aria-expanded="true" aria-controls="panel-specs" onclick="ylDetailAcc('specs')">
      <span data-i18n="detail.tab_specs">Specifications</span>
      <svg class="detail-acc-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="detail-tabpanel" id="panel-specs" role="tabpanel" aria-labelledby="tab-specs"><div id="detailSpecs"></div></div>
  </div>

  <div class="detail-section" data-section="apply">
    <button class="detail-acc-head" id="acc-apply" type="button" aria-expanded="false" aria-controls="panel-apply" onclick="ylDetailAcc('apply')">
      <span data-i18n="detail.tab_apply">Application &amp; Suitable Uses</span>
      <svg class="detail-acc-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="detail-tabpanel" id="panel-apply" role="tabpanel" aria-labelledby="tab-apply" hidden><div id="detailApply"></div></div>
  </div>

  <div class="detail-section" data-section="downloads">
    <button class="detail-acc-head" id="acc-downloads" type="button" aria-expanded="false" aria-controls="panel-downloads" onclick="ylDetailAcc('downloads')">
      <span data-i18n="detail.tab_downloads">Downloads</span>
      <svg class="detail-acc-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="detail-tabpanel" id="panel-downloads" role="tabpanel" aria-labelledby="tab-downloads" hidden><div id="detailDownloads"></div></div>
  </div>
</section>

<!-- Product Advice: outside the tabs, identical whatever tab is active -->
<div id="detailAdvice"></div>

<div class="related-section" id="relatedSection" style="display:none">
  <div class="related-section-head">
    <h2 data-i18n="common.related">Related Products</h2>
    <a class="related-view-all" href="/products"><span data-i18n="common.view_all">View all products</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
  <div class="related-grid" id="relatedGrid"></div>
</div>

<!-- Compare tray: quiet centred trigger tab; the full panel expands on demand -->
<div class="compare-tray" id="compareTray" role="region" aria-label="Product comparison tray">
  <button class="compare-tray-trigger" id="compareTrayToggle" type="button" onclick="toggleCompareTray()" aria-expanded="false" aria-controls="compareTrayPanel">
    <svg class="ctt-ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="7" height="13" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>
    <span data-i18n="common.compare">Compare</span> <span id="compareTrayCount">(0/3)</span>
    <svg class="ctt-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <div class="compare-tray-panel" id="compareTrayPanel">
    <div class="compare-tray-inner">
      <div class="compare-tray-head">
        <span class="compare-tray-title"><span data-i18n="common.compare">Compare</span> <span id="compareTrayFull">(0/3)</span></span>
        <span class="compare-tray-sub" data-i18n="detail.add3">Add up to 3 products</span>
      </div>
      <div class="compare-tray-slots" id="compareTraySlots">
        <!-- CMP-006: three PERMANENT outer slot containers. They are never
             created or destroyed -- only their inner content and state class
             change -- so removing a product cannot alter the row geometry and
             "Add a product" fills the vacated slot instead of being appended as
             a fourth element. -->
        <div class="compare-slot is-empty" data-slot="0"></div>
        <div class="compare-slot is-empty" data-slot="1"></div>
        <div class="compare-slot is-empty" data-slot="2"></div>
      </div>
      <div class="compare-tray-actions" id="compareTrayActions">
        <button class="compare-tray-clear" onclick="clearCompare()" aria-label="Clear all products from comparison" data-i18n-attr="aria-label:cmp.a11y.clear_all" data-i18n="products.clear_all">Clear all</button>
        <!-- SWUP-001: see products.html — a real anchor so Compare now uses the
             same Swup transition as every other internal route. -->
        <a class="compare-tray-btn is-disabled" id="compareBtn" href="/compare" role="button" aria-disabled="true" aria-label="Open comparison view" data-i18n-attr="aria-label:common.cmp_hint_open"><span data-i18n="detail.compare_now">Compare now</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
</div>

<!-- Footer injected by js/widgets/footer.js -->

</body>
</html>
