<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | Yee Lim Adhesives Industries</title>
  <meta id="metaDescription" name="description" content="Detailed specifications, application surfaces, and usage guide for Yee Lim Adhesives industrial products. Submit an enquiry directly to our sales team.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/products.css?v=77">
  <link rel="stylesheet" href="/css/dropdown-ui.css?v=7">
  <script src="/js/widgets/navbar.js?v=14"></script>
  <script src="/js/widgets/footer.js?v=18"></script>
</head>
<body>

<div id="swup" class="transition-fade">
<nav class="breadcrumb page-breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
  <a href="/" class="bc-home">Home</a>
  <span aria-hidden="true" class="bc-sep-home">&rsaquo;</span>
  <a href="/products#catalogue" id="breadcrumbProducts" onclick="return backToProducts(event)">Products</a>
  <span aria-hidden="true">&rsaquo;</span>
  <span id="breadcrumbProduct" aria-current="page">Loading&hellip;</span>
</nav>

<main id="mainContent">
<!-- Gallery left, product summary right -->
<div class="detail-top" id="detailPageGrid">
  <div id="detailGallery"></div>
  <div class="detail-summary" id="detailSummary"></div>
</div>

<!-- Three-tab container: Specifications / Application & Suitable Uses / Downloads -->
<section class="detail-tabs" aria-label="Product information">
  <div class="detail-tablist" role="tablist" aria-label="Product information tabs">
    <button class="detail-tab" id="tab-specs" role="tab" aria-selected="true" aria-controls="panel-specs" onclick="ylDetailTab('specs')">Specifications</button>
    <button class="detail-tab" id="tab-apply" role="tab" aria-selected="false" aria-controls="panel-apply" tabindex="-1" onclick="ylDetailTab('apply')">Application &amp; Suitable Uses</button>
    <button class="detail-tab" id="tab-downloads" role="tab" aria-selected="false" aria-controls="panel-downloads" tabindex="-1" onclick="ylDetailTab('downloads')">Downloads</button>
  </div>
  <div class="detail-tabpanel" id="panel-specs" role="tabpanel" aria-labelledby="tab-specs"><div id="detailSpecs"></div></div>
  <div class="detail-tabpanel" id="panel-apply" role="tabpanel" aria-labelledby="tab-apply" hidden><div id="detailApply"></div></div>
  <div class="detail-tabpanel" id="panel-downloads" role="tabpanel" aria-labelledby="tab-downloads" hidden><div id="detailDownloads"></div></div>
</section>

<!-- Product Advice: outside the tabs, identical whatever tab is active -->
<div id="detailAdvice"></div>

<div class="related-section" id="relatedSection" style="display:none">
  <div class="related-section-head">
    <h2>Related Products</h2>
    <a class="related-view-all" href="/products">View all products
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
  <div class="related-grid" id="relatedGrid"></div>
</div>

<!-- Compare tray -->
<div class="compare-tray" id="compareTray" role="region" aria-label="Product comparison tray">
  <div class="compare-tray-inner">
    <div class="compare-tray-head">
      <span class="compare-tray-title">Compare <span id="compareTrayCount">(0/3)</span></span>
      <span class="compare-tray-sub">Add up to 3 products</span>
    </div>
    <div class="compare-tray-slots" id="compareTraySlots"></div>
    <div class="compare-tray-actions" id="compareTrayActions">
      <button class="compare-tray-clear" onclick="clearCompare()" aria-label="Clear all products from comparison">Clear all</button>
      <button class="compare-tray-btn" id="compareBtn" onclick="location.href='/compare'" disabled aria-label="Open comparison view">Compare now
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
    <button class="compare-tray-collapse" id="compareTrayToggle" type="button" onclick="toggleCompareTray()" aria-expanded="true" aria-controls="compareTraySlots compareTrayActions" aria-label="Collapse comparison tray">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
</div>

<!-- Footer injected by js/widgets/footer.js -->

<script src="/js/vendor/swup.umd.js?v=1"></script>
<script src="/js/data.js?v=7"></script>
<script src="/js/core/app.js?v=3"></script>
<script src="/js/widgets/compare.js?v=12"></script>
<script src="/js/widgets/custom-select.js?v=4"></script>
<script src="/js/pages/products.js?v=39"></script>
<script src="/js/pages/product-detail.js?v=26"></script>
<script src="/js/pages/compare-page.js?v=14"></script>
<script src="/js/pages/enquiry.js?v=4"></script>
<script src="/js/pages/contact.js?v=2"></script>
<script src="/js/widgets/chatbot.js?v=18"></script>
<script src="/js/widgets/page-transitions.js?v=3"></script>
</body>
</html>
