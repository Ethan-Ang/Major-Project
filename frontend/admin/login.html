<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Yee Lim Adhesives</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="login-body">

  <div class="login-split">

    <!-- Left brand panel -->
    <div class="login-brand-panel">
      <div class="login-brand-content">
        <div class="login-brand-logo">YL</div>
        <h1 class="login-brand-name">Yee Lim<br>Adhesives</h1>
        <p class="login-brand-tagline">50+ years of industrial adhesive expertise — Singapore's trusted manufacturer.</p>

        <div class="login-brand-features">
          <div class="login-feature">
            <div class="login-feature-icon"><i data-lucide="package"></i></div>
            <span>Manage your product catalogue</span>
          </div>
          <div class="login-feature">
            <div class="login-feature-icon"><i data-lucide="mail"></i></div>
            <span>View and respond to enquiries</span>
          </div>
          <div class="login-feature">
            <div class="login-feature-icon"><i data-lucide="bar-chart-2"></i></div>
            <span>Track product availability</span>
          </div>
        </div>
      </div>

      <div class="login-brand-footer">
        &copy; 2025 Yee Lim Adhesives Industries Pte Ltd
      </div>
    </div>

    <!-- Right form panel -->
    <div class="login-form-panel">
      <div class="login-form-wrap">
        <div class="login-form-header">
          <h2>Welcome back</h2>
          <p>Sign in to the admin panel</p>
        </div>

        <div class="alert alert-error" id="loginError" style="display:none"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
              <i data-lucide="user" class="input-icon"></i>
              <input type="text" id="username" name="username" required
                autocomplete="username" placeholder="Enter your username">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <i data-lucide="lock" class="input-icon"></i>
              <input type="password" id="password" name="password" required
                autocomplete="current-password" placeholder="Enter your password">
              <button type="button" class="input-toggle" onclick="togglePassword()" tabindex="-1">
                <i data-lucide="eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            Sign In
          </button>
        </form>

        <p class="login-back">
          <a href="../products.html">
            <i data-lucide="arrow-left"></i>
            Back to website
          </a>
        </p>
      </div>
    </div>

  </div>

  <script src="../js/data.js"></script>
  <script src="login.js"></script>
  <script>lucide.createIcons();</script>
  <script>
    function togglePassword() {
      const input   = document.getElementById("password");
      const icon    = document.getElementById("eyeIcon");
      const showing = input.type === "text";
      input.type    = showing ? "password" : "text";
      icon.setAttribute("data-lucide", showing ? "eye" : "eye-off");
      lucide.createIcons();
    }
  </script>
</body>
</html>
