<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Yee Lim Adhesives</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">YEE LIM</div>
    <h1>Admin Login</h1>
    <p class="login-sub">Sign in to manage the product catalogue.</p>

    <div class="alert alert-error" id="loginError" style="display:none"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script src="../js/data.js"></script>
  <script src="login.js"></script>
</body>
</html>
