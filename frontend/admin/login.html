<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Yee Lim Adhesives</title>
  <link rel="stylesheet" href="admin.css?v=16">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="login-body">

  <main class="login-grid">

    <!-- Left: red "label plate" -->
    <section class="login-plate" aria-hidden="true">
      <span class="login-plate-frame"></span>
      <span class="login-plate-watermark">1976</span>

      <div class="login-plate-top">
        <span class="login-plate-seal"><img src="/images/logos/ylai-seal.png" alt=""></span>
        <span class="login-plate-est">Est. 1976</span>
      </div>

      <div class="login-plate-mid">
        <span class="login-plate-eyebrow">Commercial &amp; Industrial Adhesives</span>
        <h1 class="login-plate-word">Yee<br>Lim</h1>
        <span class="login-plate-outline">Adhesives</span>
      </div>

      <div class="login-plate-bottom">
        <div class="login-plate-ranges">
          <span>Deer&trade;</span><span>Horsemen&trade;</span><span>Premier&trade;</span><span>Rhino&trade;</span>
        </div>
        <span>Lot / 2026</span>
      </div>
    </section>

    <!-- Right: form -->
    <section class="login-panel">
      <div class="login-panel-meta">
        <span>Admin Console</span>
        <span>Singapore</span>
      </div>

      <div class="login-panel-inner">
        <div class="login-panel-header">
          <h2 class="login-panel-title">Sign in<span class="login-dot">.</span></h2>
          <p class="login-panel-sub">Manage the catalogue, products, and customer enquiries.</p>
        </div>

        <div class="alert alert-error" id="loginError" style="display:none"></div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="login-form">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
              autocomplete="username" placeholder="Enter your username" class="login-input">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field-input-wrap">
              <input type="password" id="password" name="password" required
                autocomplete="current-password" placeholder="Enter your password" class="login-input">
              <button type="button" class="input-toggle" onclick="togglePassword()" aria-label="Show password" id="pwToggle">
                <i data-lucide="eye" id="eyeIcon" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span>Sign In</span>
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <div class="login-panel-footer">
          <a href="/products" class="login-back">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            Back to website
          </a>
          <span class="login-panel-footer-meta">YLAI-Admin &middot; SG</span>
        </div>
      </div>
    </section>

  </main>

  <script src="../js/data.js?v=5"></script>
  <script src="login.js?v=2"></script>
  <script>lucide.createIcons();</script>
  <script>
    function togglePassword() {
      const input   = document.getElementById("password");
      const icon    = document.getElementById("eyeIcon");
      const btn     = document.getElementById("pwToggle");
      const showing = input.type === "text";
      input.type    = showing ? "password" : "text";
      icon.setAttribute("data-lucide", showing ? "eye" : "eye-off");
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      lucide.createIcons();
    }
  </script>
</body>
</html>
