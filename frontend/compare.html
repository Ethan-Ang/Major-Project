<head>

<body>

<div id="swup" class="transition-fade">
<main id="mainContent">
<div class="compare-page-top">
  <div class="compare-page-title-wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span aria-hidden="true">&rsaquo;</span>
      <a href="/products">Products</a>
      <span aria-hidden="true">&rsaquo;</span>
      <span>Compare</span>
    </nav>
    <h1>Compare Selected Products</h1>
  </div>
  <div class="compare-page-controls">
    <div class="cx-difftoggle cx-difftoggle--header" id="cxDiffToggle" hidden>
      <span class="cx-difflabel">Highlight differences</span>
      <button class="cx-switch" role="switch" aria-checked="false"
        aria-label="Highlight differences between products" onclick="toggleDiff()">
        <span class="cx-knob"></span>
      </button>
    </div>
    <button class="compare-page-clear" onclick="clearAll()">Clear all</button>
  </div>
</div>

<div class="compare-page-body" id="comparePageContent">
  <div class="empty-state">
    <p>Loading…</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
</div>
