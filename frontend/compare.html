<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compare Selected Products | Yee Lim Adhesives Industries</title>
  <script>
    try {
      document.documentElement.dataset.compareCount = String(Math.min(3,
        JSON.parse(localStorage.getItem("compareList") || "[]").length));
    } catch (error) {
      document.documentElement.dataset.compareCount = "0";
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/products.css?v=112">
  <link rel="stylesheet" href="/css/dropdown-ui.css?v=9">
  <script src="/js/i18n.js?v=12"></script>
  <script src="/js/i18n-products.js?v=2"></script>
  <script src="/js/widgets/navbar.js?v=25"></script>
  <script src="/js/widgets/footer.js?v=24"></script>
</head>
<body>

<div id="swup" class="transition-fade">
<main id="mainContent">
<div class="compare-page-top">
  <!-- Same treatment as Product Detail: task pages do not claim a primary-nav
       active state. The H1 names the page, with one compact catalogue link once
       the full navigation collapses on mobile. -->
  <div class="detail-backrow">
    <a class="detail-back" id="detailBackLink" href="/products"
       onclick="ylBackToCatalogue()" data-i18n-attr="aria-label:common.back_products">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      <span data-i18n="common.back_products">Back to Products</span>
    </a>
  </div>
  <h1 data-i18n="compare.title">Compare Products</h1>
  <p class="compare-page-lead" data-i18n="compare.lead">Side-by-side comparison to help you find the right bonding solution.</p>
</div>

<section class="compare-select-panel" id="compareSelectPanel" aria-label="Products to compare"></section>

<div class="compare-page-body" id="comparePageContent">
  <div class="empty-state">
    <p>Loading…</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
</div>

<!-- Footer injected by js/widgets/footer.js -->

<script src="/js/vendor/swup.umd.js?v=1"></script>
<script src="/js/data.js?v=11"></script>
<script src="/js/core/app.js?v=5"></script>
<script src="/js/widgets/compare.js?v=22"></script>
<script src="/js/widgets/custom-select.js?v=6"></script>
<script src="/js/pages/products.js?v=55"></script>
<script src="/js/pages/product-detail.js?v=39"></script>
<script src="/js/pages/compare-page.js?v=21"></script>
<script src="/js/pages/enquiry.js?v=9"></script>
<script src="/js/pages/contact.js?v=6"></script>
<script src="/js/widgets/chatbot.js?v=29"></script>
<script src="/js/widgets/page-transitions.js?v=6"></script>
</body>
</html>
