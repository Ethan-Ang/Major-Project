<!-- is-loading reserves 70dvh (see .compare-page-body.is-loading) so the initial
     "Loading…" line does not sit in a short box that the real table or the
     empty state then shoves the footer away from. compare-page.js replaces the
     whole element's contents, dropping the class with them. -->
<div class="compare-page-body is-loading" id="comparePageContent">
